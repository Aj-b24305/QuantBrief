[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantbrief"
version = "0.1.0"
description = "QuantBrief - deterministic portfolio risk engine (FastAPI + NumPy/Pandas) with LLM memo synthesis and streaming chat advisor"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "QuantBrief" }]
keywords = ["risk", "portfolio", "var", "beta", "sharpe", "fastapi", "quant", "llm", "streamlit"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "yfinance>=0.2.40",
    "openai>=1.40.0",
    "httpx>=0.27.0",
    "streamlit>=1.36.0",
    "plotly>=5.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.5.0",
]

[project.scripts]
quantbrief = "quantbrief.main:main"
quantbrief-dashboard = "quantbrief._dashboard_runner:main"

[tool.hatch.build.targets.wheel]
packages = ["quantbrief"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.ruff]
line-length = 110
target-version = "py311"